<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
    <title>Intellector</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8a5a1f">
    <script>
        window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.deferredInstallPrompt = e; window.dispatchEvent(new Event("installpromptchange")); });
        window.addEventListener("appinstalled", () => { window.deferredInstallPrompt = null; window.dispatchEvent(new Event("installpromptchange")); });
    </script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: #e9e3d9; }
        #haxeui-root { width: 100%; height: 100svh; }
    </style>
</head>
<body>
    <script>
        (function () {
            var API_BASE_URL = "https://play-intellector.ru";
            window.API_BASE_URL = API_BASE_URL; // read by the release build's Config
            var API_VERSION_KEY = "intellector.api_version";
            var RETRY_DELAY_MS = 5000;
            var host = window.location.hostname;
            var isDev = host === "localhost" || host === "127.0.0.1" || /^(192\.168|10)\./.test(host);
            var serviceWorkerUrl = new URL("sw.js", document.baseURI).href;

            function readStoredApiVersion() {
                try {
                    var stored = window.localStorage.getItem(API_VERSION_KEY);
                    return /^\d+$/.test(stored) ? stored : null;
                } catch (e) {
                    return null;
                }
            }

            function storeApiVersion(apiVersion) {
                try {
                    window.localStorage.setItem(API_VERSION_KEY, String(apiVersion));
                } catch (e) {
                }
            }

            function clearStoredApiVersion() {
                try {
                    window.localStorage.removeItem(API_VERSION_KEY);
                } catch (e) {
                }
            }

            // The client of an API version lives in its own folder; the base makes every relative URL of the app resolve inside it
            function loadClient(folder) {
                if (folder) {
                    var base = document.createElement("base");
                    base.href = folder;
                    document.head.appendChild(base);
                }

                var script = document.createElement("script");
                script.src = "bin/app.js";
                if (folder)
                    script.onerror = function () {
                        // The folder of the stored version has been pruned from the server
                        clearStoredApiVersion();
                        base.remove();
                        loadClientOfServer();
                    };
                document.body.appendChild(script);

                // Through a blob, as importing the file directly fails if the web server gives .js a non-JavaScript MIME type
                fetch(new URL("assets/vendor/gifenc/gifenc.esm.js", document.baseURI).href)
                    .then(function (response) { return response.text(); })
                    .then(function (source) { return import(URL.createObjectURL(new Blob([source], {type: "text/javascript"}))); })
                    .then(function (gifenc) { window.gifenc = gifenc; })
                    .catch(function (e) { console.warn("Failed to load gifenc: GIF export is unavailable", e); });
            }

            function loadClientOfServer() {
                fetch(API_BASE_URL + "/version", {cache: "no-store"})
                    .then(function (response) { return response.json(); })
                    .then(function (version) {
                        storeApiVersion(version.api);
                        loadClient("v/" + version.api + "/");
                    })
                    .catch(function () { window.setTimeout(loadClientOfServer, RETRY_DELAY_MS); });
            }

            var storedApiVersion = readStoredApiVersion();
            if (isDev)
                loadClient(null);
            else if (storedApiVersion !== null)
                loadClient("v/" + storedApiVersion + "/");
            else
                loadClientOfServer();

            if ("serviceWorker" in navigator)
                window.addEventListener("load", function () {
                    navigator.serviceWorker.register(serviceWorkerUrl).catch(function (e) { console.warn("Service worker registration failed", e); });
                });
        })();
    </script>
</body>
</html>
